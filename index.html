<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>21st Clone — Community Components</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="h-full bg-white text-ink-900 antialiased dark:bg-ink-950 dark:text-ink-100">
    <div id="root" class="h-full"></div>
    <script>
      window.addEventListener('error', function(e) {
        if (document.getElementById('root').childElementCount === 0) {
          document.getElementById('root').innerHTML =
            '<pre style="padding:24px;color:#dc2626;font-family:monospace;white-space:pre-wrap">' +
            '<strong>JS Error (React did not mount):</strong>\n' +
            (e.message || '') + '\n' + (e.filename || '') + ':' + e.lineno +
            (e.error && e.error.stack ? '\n\nStack:\n' + e.error.stack : '') +
            '</pre>';
        }
      });
      window.addEventListener('unhandledrejection', function(e) {
        if (document.getElementById('root').childElementCount === 0) {
          document.getElementById('root').innerHTML =
            '<pre style="padding:24px;color:#dc2626;font-family:monospace;white-space:pre-wrap">' +
            '<strong>Unhandled Promise Rejection:</strong>\n' +
            (e.reason && e.reason.stack ? e.reason.stack : String(e.reason)) +
            '</pre>';
        }
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
